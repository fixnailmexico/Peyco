function field(form,label,key,value='',type='text'){const l=node('label',label),i=node('input');i.name=key;i.type=type;i.value=value;i.required=true;if(type==='number'){i.min='0';i.step=key==='precio'||key==='costo'?'0.01':'1'}l.append(i);form.append(l);return i}
function formSubmit(form,fn){const b=node('button','Guardar');form.append(b);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await fn(new FormData(form));$('msg').textContent='Guardado correctamente.'}catch(err){$('msg').textContent=err.message}finally{b.disabled=false}}}
async function open(name){$('modules').hidden=true;$('work').hidden=false;$('heading').textContent=name;$('msg').textContent='';const c=$('content');c.replaceChildren();const admin=profile.rol==='administrador';if(name==='Vendedores'&&admin){c.append(button('Agregar vendedor',()=>{const f=node('form');field(f,'Nombre completo','nombre');const u=field(f,'Usuario (sin correo)','usuario');u.autocomplete='off';const pw=field(f,'Contraseña','password','','password');pw.autocomplete='new-password';pw.minLength=8;formSubmit(f,async d=>{const nombre=String(d.get('nombre')).trim(),usuario=String(d.get('usuario')).trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),password=String(d.get('password'));if(!nombre||!/^[a-z0-9._-]+$/.test(usuario)||password.length<8)throw Error('Completa el nombre, usuario válido y contraseña de al menos 8 caracteres.');const secondary=initializeApp(app.options,'alta-'+crypto.randomUUID());let secondaryAuth,created,attempted=false;try{secondaryAuth=getAuth(secondary);await setPersistence(secondaryAuth,inMemoryPersistence);created=await createUserWithEmailAndPassword(secondaryAuth,usuario+'@peyc.example',password);attempted=true;await setDoc(doc(db,'usuarios',created.user.uid),{nombre,usuario,rol:'vendedor',activo:true});}catch(err){if(created&&attempted){try{const check=await getDoc(doc(db,'usuarios',created.user.uid));if(!check.exists())await deleteUser(created.user);else if(check.data().usuario===usuario&&check.data().rol==='vendedor'){await open(name);return;}}catch(cleanup){throw Error('No se pudo confirmar el alta. Revisa Authentication y Firestore antes de reintentar.');}}throw Error(err.code==='auth/email-already-in-use'?'El usuario ya existe.':err.message);}finally{pw.value='';if(secondaryAuth)await signOut(secondaryAuth).catch(()=>{});await deleteApp(secondary).catch(()=>{});}await open(name)});c.replaceChildren(f);c.append(button('Cancelar',()=>open(name)))}));c.append(node('p','Crea cuentas directamente. Los usuarios con acentos se guardan sin acentos. Las contraseñas se restablecen desde Firebase.'));const snap=await getDocs(collection(db,'usuarios'));for(const x of snap.docs){const p=x.data();if(p.rol!=='vendedor')continue;const row=node('div');row.className='tile';row.append(node('strong',p.nombre+' · '+p.usuario),node('p',p.activo?'Activo':'Inactivo'),button(p.activo?'Desactivar':'Reactivar',async()=>{await updateDoc(x.ref,{activo:!p.activo});await open(name)}));c.append(row)}return}
if(name==='Catálogo de productos'||name==='Inventario'){if(admin&&name==='Catálogo de productos')c.append(button('Agregar producto',()=>editProduct(null,name)));const snap=await getDocs(collection(db,'productos'));for(const x of snap.docs){const p=x.data();if(!admin&&!p.activo)continue;const row=node('div');row.className='tile';row.append(node('strong',p.nombre+' · '+p.codigo),node('p','Precio: $'+Number(p.precio).toFixed(2)+' | Existencias: '+p.stock+' | '+(!p.activo?'Inactivo':p.stock===0?'Agotado':p.stock<=p.minimo?'Stock bajo':'Disponible')));if(admin){if(name==='Catálogo de productos')row.append(button('Editar',()=>editProduct(x,name)),button(p.activo?'Desactivar':'Reactivar',async()=>{await updateDoc(x.ref,{activo:!p.activo});await open(name)}));else row.append(button('Ajustar existencias',()=>adjust(x,name)))}c.append(row)}return}c.append(node('p','Módulo pendiente de desarrollo.'))}
function editProduct(x,name){const c=$('content');c.replaceChildren();const p=x?.data()||{},f=node('form');for(const [label,key,type] of [['Nombre','nombre','text'],['Código','codigo','text'],['Categoría','categoria','text'],['Precio de venta','precio','number'],['Stock mínimo','minimo','number']])field(f,label,key,p[key]??'',type);if(!x)field(f,'Inventario inicial','stock',0,'number');formSubmit(f,async d=>{const data={nombre:String(d.get('nombre')).trim(),codigo:String(d.get('codigo')).trim(),categoria:String(d.get('categoria')).trim(),precio:Number(d.get('precio')),minimo:Number(d.get('minimo'))};if(!data.nombre||!data.codigo||!data.categoria)throw Error('Completa los datos');if(x)await updateDoc(x.ref,data);else await setDoc(doc(collection(db,'productos')),{...data,stock:Number(d.get('stock')),activo:true});await open(name)});c.append(f)}
function adjust(x,name){const c=$('content');c.replaceChildren();const f=node('form');field(f,'Nueva existencia total','stock',x.data().stock,'number');field(f,'Motivo del ajuste','motivo');formSubmit(f,async d=>{await runTransaction(db,async t=>{const old=await t.get(x.ref);if(old.data().stock!==x.data().stock)throw Error('Existencias cambiaron. Regresa al menú y vuelve a consultar.');t.update(x.ref,{stock:Number(d.get('stock'))});t.set(doc(collection(db,'movimientos')),{producto:x.id,anterior:old.data().stock,nuevo:Number(d.get('stock')),motivo:String(d.get('motivo')),uid:auth.currentUser.uid,fecha:serverTimestamp()})});await open(name)});c.append(f)}
try{await setPersistence(auth,browserSessionPersistence);onAuthStateChanged(auth,async user=>{ $('dash').hidden=true;$('login').hidden=false;if(!user){$('enter').disabled=busy;return;}try{const snap=await getDoc(doc(db,'usuarios',user.uid));const p=snap.data();if(!snap.exists()||p.activo!==true||!['administrador','vendedor'].includes(p.rol))throw Error('Acceso no autorizado');if(auth.currentUser?.uid!==user.uid)return;profile=p;$('role').textContent=p.rol==='administrador'?'Panel de administración':'Panel de vendedor';menu();$('welcome').textContent='Bienvenido, '+p.nombre;$('status').textContent='';$('login').hidden=true;$('dash').hidden=false;}catch(e){$('status').textContent='No se pudo validar el perfil administrativo. Revisa los permisos de Firestore.';await signOut(auth);}});$('status').textContent='';$('enter').disabled=false;}catch(e){$('status').textContent='No se pudo iniciar Firebase. Recarga la página.';}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('enter').disabled=true;$('status').textContent='Verificando acceso…';try{await signInWithEmailAndPassword(auth,$('user').value.trim().toLowerCase()+'@peyc.example',$('pass').value);}catch(e){$('status').textContent='No se pudo ingresar. Verifica usuario y contraseña o la conexión.';}finally{$('pass').value='';busy=false;$('enter').disabled=false;}});
$('logout').addEventListener('click',async()=>{try{await signOut(auth);$('status').textContent='Sesión cerrada.';}catch(e){alert('No se pudo cerrar sesión. Intenta nuevamente.')}});
</script></body></html>
